[package]
name = "bai7_2_rest_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Môi trường chạy bất đồng bộ cho server (mỗi kết nối một tác vụ, như Mã giả 6.3)
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
# JSON cho thân yêu cầu/phản hồi; preserve_order giữ thứ tự khóa như từ điển Python
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
