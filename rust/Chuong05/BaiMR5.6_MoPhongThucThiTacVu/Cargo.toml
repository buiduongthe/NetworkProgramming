[package]
name = "mr5_6_mo_phong_thuc_thi_tac_vu"
version = "0.1.0"
edition = "2021"
description = "Bài mở rộng MR5.6 – Mô phỏng thực thi tác vụ: đơn/đa luồng × đồng bộ/bất đồng bộ, chen ngang, phụ thuộc"
publish = false

# Lõi mô phỏng (không phụ thuộc thư viện ngoài) dùng chung cho hai chương trình
[lib]
name = "lap_lich"
path = "src/lap_lich.rs"

[[bin]]
name = "mo_phong"        # bản dòng lệnh, chỉ dùng thư viện chuẩn
path = "src/mo_phong.rs"

[[bin]]
name = "ung_dung"        # ứng dụng giao diện (eframe/egui), vai trò --demo chụp ket_qua_gui.png
path = "src/ung_dung.rs"

[dependencies]
# --- Ứng dụng giao diện; cùng phiên bản với các bài GUI Rust khác của kho ---
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
miniz_oxide = "=0.8.9"   # nén zlib cho tệp PNG chụp cửa sổ (ket_qua_gui.png)
