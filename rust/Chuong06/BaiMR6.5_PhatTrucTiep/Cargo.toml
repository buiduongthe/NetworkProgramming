[package]
name = "mr6_5_phat_truc_tiep"
version = "0.1.0"
edition = "2021"
description = "Bài mở rộng MR6.5 – Phát trực tiếp âm thanh + video 1→n: máy chủ SFU, khung I/P, bộ đệm GOP, xin khung khóa, đồng bộ tiếng-hình"
publish = false

[dependencies]
ctrlc = "=3.4.7"
miniz_oxide = "=0.8.9"   # nén/giải nén zlib (RFC 1950) thuần Rust, thay cho mô-đun zlib của Python
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
socket2 = "=0.5.10"      # đặt SO_RCVBUF/SO_SNDBUF 1 MB cho socket UDP (std không có hàm này)
chrono = { version = "=0.4.41", default-features = false, features = ["clock"] }   # giờ địa phương HH:MM:SS cho nhật ký
# --- Ứng dụng giao diện (server_gui, phat_gui, xem_gui, demo_gui); camera/tệp video qua tiến trình ffmpeg ---
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.15.3"         # micro/loa thật đa nền tảng (WASAPI trên Windows, ALSA trên Linux, CoreAudio trên macOS)
