[package]
name = "bai6_7_kiem_thu_tai"
version = "0.1.0"
edition = "2021"

[dependencies]
# Môi trường chạy bất đồng bộ cho bộ sinh tải (N tác vụ, WHEN_ALL)
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# JSON cho khung tin nhắn (Mã giả 3.6); preserve_order giữ thứ tự khóa như từ điển Python
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
