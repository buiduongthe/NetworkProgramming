[package]
name = "mr6_2_hoi_thoai_am_thanh"
version = "0.1.0"
edition = "2021"
description = "Bài mở rộng MR6.2 – Phòng hội thoại âm thanh nhiều client: RTP/UDP, trộn mix-minus, WAV, Goertzel"
publish = false

[dependencies]
ctrlc = "=3.4.7"
serde = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# --- Ứng dụng giao diện (server_gui, khach_gui, demo_gui) ---
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "=0.15.3"          # micro/loa thật đa nền tảng (WASAPI trên Windows, ALSA trên Linux, CoreAudio trên macOS)
miniz_oxide = "=0.8.9"    # nén zlib cho tệp PNG chụp cửa sổ (ket_qua_gui.png)
