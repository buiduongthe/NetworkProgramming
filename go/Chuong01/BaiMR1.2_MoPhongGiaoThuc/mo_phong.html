<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng giao thức mạng</title>

<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#c9ced8; --accent:#2457c5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding:14px 20px 6px; }
  h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; color:var(--muted); }
  #tabs { display:flex; flex-wrap:wrap; gap:6px; padding:8px 20px; }
  #tabs button { border:1px solid var(--line); background:var(--card); border-radius:16px; padding:4px 12px; cursor:pointer; font:inherit; }
  #tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #bar { display:flex; align-items:center; gap:10px; padding:4px 20px 10px; flex-wrap:wrap; }
  #bar button, #bar select { font:inherit; padding:3px 10px; }
  #slider { flex:1; min-width:200px; }
  #clock { font-variant-numeric:tabular-nums; min-width:170px; text-align:right; font-weight:600; }
  main { display:grid; grid-template-columns:minmax(0, 3fr) minmax(260px, 1.25fr); gap:12px; padding:0 20px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .card h2 { margin:0 0 6px; font-size:14px; }
  canvas { width:100%; height:auto; display:block; }
  #log { font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; height:440px; overflow-y:auto; }
  #log div { white-space:pre-wrap; border-bottom:1px dotted #e4e7ec; padding:1px 0; }
  #log div.new { background:#fff6d6; }
  #legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; color:var(--muted); font-size:12px; }
  #legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; background:var(--c); vertical-align:-1px; }
  #chartCard { display:none; grid-column:1 / -1; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } #log { height:260px; } }
</style>
</head>
<body>
<header>
  <h1>Mô phỏng giao thức mạng theo sự kiện rời rạc</h1>
  <p id="sub">Bài mở rộng MR1.2 – hoạt hình phát lại đúng các sự kiện của lần chạy mô phỏng.</p>
</header>
<div id="tabs"></div>
<div id="bar">
  <button id="play">⏸ Dừng</button>
  <label>Tốc độ <select id="speed">
    <option value="0.25">× 0,25</option><option value="0.5">× 0,5</option>
    <option value="1" selected>× 1</option><option value="2">× 2</option><option value="4">× 4</option>
  </select></label>
  <input id="slider" type="range" min="0" max="1000" value="0">
  <span id="clock"></span>
</div>
<main>
  <div class="card">
    <h2 id="title"></h2>
    <canvas id="net" width="900" height="420"></canvas>
    <div id="legend"></div>
  </div>
  <div class="card"><h2>Nhật ký sự kiện</h2><div id="log"></div></div>
  <div class="card" id="chartCard"><h2>Cửa sổ tắc nghẽn cwnd (MSS) theo thời gian</h2>
    <canvas id="chart" width="1200" height="170"></canvas></div>
</main>

function ms(t) { return (Math.floor(t / 100) / 10).toFixed(1); }
function duration(r) {
  let d = 0;
  r.hops.forEach(h => d = Math.max(d, h[1]));
  r.notes.forEach(n => d = Math.max(d, n[0]));
  return d + 3000;
}
function select(id) {
  run = DATA.runs.find(r => r.id === id) || DATA.runs[0];
  D = duration(run); T = 0;
  run.notes.sort((a, b) => a[0] - b[0]);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === run.id));
  document.getElementById("title").textContent = run.title;
  document.getElementById("chartCard").style.display = run.cwnd ? "block" : "none";
  const kinds = [...new Set(run.hops.map(h => h[4]))];
  document.getElementById("legend").innerHTML = kinds.map(k => `<span style="--c:${COLORS[k]}">${NAMES[k]}</span>`).join("")
    + `<span style="--c:#d1344b">× mất gói</span>`;
}
function isDown(kind, name) {           
  let down = false;
  (run.changes || []).forEach(c => { if (c[0] <= T && c[1] === kind && c[2] === name) down = !c[3]; });
  return down;
}
function lanBox(x, y, w, h, text) {
  g.fillStyle = "#eef3fb"; g.strokeStyle = "#c9d6ee"; g.lineWidth = 1;
  g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.stroke();
  g.fillStyle = "#5b6b8c"; g.font = "12px system-ui"; g.textAlign = "left"; g.fillText(text, x + 10, y + 18);
}
function drawNet() {
  g.clearRect(0, 0, cv.width, cv.height);
  lanBox(10, 30, 222, 370, "LAN A 192.168.1.0/24");
  lanBox(668, 30, 222, 370, "LAN B 192.168.2.0/24");
  DATA.links.forEach(l => {                     
    const a = node[l.a], b = node[l.b], down = isDown("link", l.a + "-" + l.b);
    g.strokeStyle = down ? "#d1344b" : "#9aa3b2"; g.lineWidth = l.cost > 1 || a.kind === "router" && b.kind === "router" ? 3 : 2;
    g.setLineDash(down ? [6, 5] : []);
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); g.setLineDash([]);
    if (a.kind === "router" && b.kind === "router") {
      g.fillStyle = "#667085"; g.font = "11px system-ui"; g.textAlign = "center";
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + (a.y === b.y ? 16 : -8);
      g.fillText("chi phí " + l.cost, mx, my);
    }
  });
  const recent = {};                            
  run.notes.forEach(n => { if (n[1] && n[0] <= T && T - n[0] < D / 60) recent[n[1]] = true; });
  DATA.nodes.forEach(n => {
    const down = isDown("node", n.name);
    g.lineWidth = recent[n.name] ? 4 : 1.5;
    g.strokeStyle = recent[n.name] ? "#f2b705" : "#3a4256";
    g.fillStyle = down ? "#d9dce3" : n.kind === "router" ? "#ffe9c7" : n.kind === "switch" ? "#dfe9ff" : "#ffffff";
    g.beginPath();
    if (n.kind === "router") g.arc(n.x, n.y, 26, 0, 7);

    g.fill(); g.stroke();
    g.fillStyle = down ? "#8a8f99" : "#1d2330"; g.textAlign = "center";
    g.font = "bold 14px system-ui"; g.fillText(n.name, n.x, n.y + (n.kind === "host" ? -2 : 5));
    if (n.kind === "host") { g.font = "10px system-ui"; g.fillStyle = "#667085"; g.fillText(n.ip, n.x, n.y + 13); }

      g.moveTo(n.x - 14, n.y - 14); g.lineTo(n.x + 14, n.y + 14); g.moveTo(n.x + 14, n.y - 14); g.lineTo(n.x - 14, n.y + 14); g.stroke(); }
  });

    const a = node[h[2]], b = node[h[3]];
    let f = (T - h[0]) / Math.max(1, h[1] - h[0]);
    if (h[6] && f >= 0.5) {                      
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;

    let prev = null;
    run.cwnd.forEach(c => { if (c[0] > upto) return;
      const x = X(c[0]), y = Y(c[1] / 1000);
      if (prev === null) gc.moveTo(x, y); else { gc.lineTo(x, prev); gc.lineTo(x, y); }
      prev = y; });
    if (prev !== null) gc.lineTo(X(Math.min(upto, D)), prev);
    gc.stroke();
  };
  path(D, "#d5dcea", 2); path(T, COLORS.TCP, 2.5);
  gc.strokeStyle = "#f2b705"; gc.lineWidth = 1.5; gc.beginPath(); gc.moveTo(X(T), 6); gc.lineTo(X(T), H - B); gc.stroke();
}
function drawLog() {
  const shown = run.notes.filter(n => n[0] <= T).slice(-40), box = document.getElementById("log");
  box.innerHTML = shown.map((n, i) =>
    `<div class="${i === shown.length - 1 ? "new" : ""}">${ms(n[0]).padStart(6)} ms  ${n[2].replace(/</g, "&lt;")}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}
function frame(now) {
  if (last !== null && playing) {
    const rate = D / 20000 * parseFloat(document.getElementById("speed").value);  
    T += (now - last) * rate;
    if (T > D) T = 0;
  }
  last = now;
  render();
  requestAnimationFrame(frame);
}
function render() {
  document.getElementById("slider").value = Math.round(1000 * T / D);
  document.getElementById("clock").textContent = `t = ${ms(T)} / ${ms(D)} ms`;
  drawNet(); drawChart(); drawLog();
}
function seek(id, t, pause) { select(id); T = t; playing = !pause; updatePlay(); render(); }
function updatePlay() { document.getElementById("play").textContent = playing ? "⏸ Dừng" : "▶ Chạy"; }
DATA.runs.forEach(r => {
  const b = document.createElement("button"); b.textContent = r.id; b.dataset.id = r.id;
  b.onclick = () => select(r.id); document.getElementById("tabs").appendChild(b);
});
document.getElementById("play").onclick = () => { playing = !playing; updatePlay(); };
document.getElementById("slider").oninput = e => { T = D * e.target.value / 1000; render(); };
const hp = new URLSearchParams(location.hash.slice(1));    
select(hp.get("kb") || DATA.runs[0].id);
if (hp.get("t")) T = parseFloat(hp.get("t"));
if (hp.get("dung")) playing = false;
updatePlay();
requestAnimationFrame(frame);
</script>
</body>
